[keyboard]
name = "Air75"
product_name = "Air75"
product_id = 0x4152
vendor_id = 0x3EED
manufacturer = "Krish Agarwal (ikrishagarwal)"
chip = "rp2040"

[matrix]
row_pins = ["PIN_2", "PIN_4", "PIN_3"]
col_pins = ["PIN_26", "PIN_27", "PIN_28", "PIN_29"]
bootmagic = [0, 0]

[[input_device.encoder]]
pin_a = "PIN_0"
pin_b = "PIN_1"
internal_pullup = true
phase = "resolution"
resolution = 4
reverse = true
debounce_ms = 0

[display]
driver = "ssd1306"
size = "128x32"
rotation = 180
renderer = "crate::bongocat_renderer::BongocatRenderer"
render_interval = 100
# Keep keypress-triggered tap frames immediate, like the custom display task.
min_render_interval = 0

[display.protocol.i2c]
instance = "I2C1"
sda = "PIN_6"
scl = "PIN_7"
address = 0x3C

[host]
vial_enabled = true
rynk_enabled = false
unlock_keys = [[0, 0], [2, 3]]
insecure = false

[storage]
enabled = true
# Set clear_storage to false to keep Vial changes across reboots.
clear_storage = true # Set true only for a deliberate reset of saved Vial settings.

# Macro(0): Vim copy ("*y).
[[behavior.macros.macros]]
operations = [
    { operation = "tap", keycode = "WM(Quote, LShift)" },
    { operation = "tap", keycode = "WM(Kc8, LShift)" },
    { operation = "tap", keycode = "Y" },
]

# Macro(1): Vim paste (Escape, "*p).
[[behavior.macros.macros]]
operations = [
    { operation = "tap", keycode = "Escape" },
    { operation = "tap", keycode = "WM(Quote, LShift)" },
    { operation = "tap", keycode = "WM(Kc8, LShift)" },
    { operation = "tap", keycode = "P" },
]

[layout]
rows = 3
cols = 4
map = """
[2.0]  (0,0)  (0,3)  (e,0)
(1,0)  (1,1)  (1,2)  (1,3)
(2,0)  (2,1)  (2,2)  (2,3)
"""

[keymap]
layers = 5

[[keymap.layer]] # layer 0
name = "Media"
keys = """
TO(1)          WM(L, LGui)
MediaPrevTrack MediaPlayPause  MediaNextTrack F
WM(Comma, LShift)  WM(Dot, LShift)    Left    Right
"""
encoders = [["AudioVolDown", "AudioVolUp"]]

[[keymap.layer]] # layer 1
name = "General"
keys = """
TO(2)          _
_                  _                   _      WM(Space, LAlt)
WM(Equal, LCtrl)   WM(Minus, LCtrl)    Left   Right
"""
encoders = [["MouseWheelDown", "MouseWheelUp"]]

[[keymap.layer]] # layer 2
name =  "Vim"
keys = """
TO(3)          _
_              _       _          _
J              K       Macro(0)   Macro(1)
"""
encoders = [["AudioVolDown", "AudioVolUp"]]

[[keymap.layer]] # layer 3
name = "Game"
keys = """
TO(0)   LT(4, Escape)
Q W LShift E
A S D Space
"""
encoders = [["AudioVolDown", "AudioVolUp"]]

[[keymap.layer]] # layer 4
name = "Helper"
keys = """
WM(L, LGui) No
MediaPrevTrack MediaPlayPause  MediaNextTrack F
WM(Equal, LCtrl)   WM(Minus, LCtrl)    Left   Right
"""
encoders = [["AudioVolDown", "AudioVolUp"]]
