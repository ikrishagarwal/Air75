[keyboard]
name = "Air75"
product_name = "Air75"
product_id = 0x4152
vendor_id = 0x3EED
manufacturer = "Krish Agarwal (ikrishagarwal)"
chip = "rp2040"

[matrix]
row_pins = ["PIN_2", "PIN_4", "PIN_3"]
col_pins = ["PIN_26", "PIN_27", "PIN_28", "PIN_29"],
boot_magic = [0, 0]

# RMK uses col2row as the default matrix diode direction, if you want to use a row2col matrix, add `row2col = true`
# row2col = true

[[input_device.encoder]]
pin_a = "PIN_0"
pin_b = "PIN_1"
internal_pullup = true
phase = "resolution"
resolution = 4
reverse = true
debounce_ms = 10

[display]
driver = "ssd1306"
size = "128x32"
rotation = 180
min_render_interval = 10
render_interval = 100

[display.protocol.i2c]
instance = "I2C1"
sda = "PIN_6"
scl = "PIN_7"

[host]
vial_enabled = true
rynk_enabled = false
unlock_keys = [[0, 0], [0, 3]]
insecure = false

[storage]
enabled = true
clear_storage = true

[layout]
rows = 3
cols = 4
map = """
[2]    (0,0)  (0,3)  (0,e)
(1,0)  (1,1)  (1,2)  (1,3)
(2,0)  (2,1)  (2,2)  (2,3)
"""

[keymap]
layers = 4

[[keymap.layer]] # layer 0
name = "General"
keys = """
TO(1)          No      No      LGui(L)
MediaPrevTrack MediaPlayPause  MediaNextTrack LAlt(Space)
LCtrl(Equal)   LCtrl(Minus)    Left           Right
"""

[[keymap.layer]] # layer 1
name = "Media"
keys = """
TO(2)          No             No      _
_              _              _       F
LShift(Comma)  LShift(Dot)    Left    Right
"""

[[keymap.layer]] # layer 2
name =  "Vim"
keys = """
TO(3)          No      No         _
_              _       _          _
J              K       Macro(0)   Macro(1)
"""

[[keymap.layer]] # layer 3
name = "Code"
keys = """
TO(0)          No             No             _
_              _              _              _
LCtrl(C)       LCtrl(V)       LCtrl(X)       LCtrl(Z)
"""

[[input_device.encoder]]
# Encoder mappings for layers 0 to 3
layers = [
    ["MouseWheelDown", "MouseWheelUp"],
    ["MediaVolumeUp", "MediaVolumeDown"],
    ["MediaVolumeUp", "MediaVolumeDown"],
    ["MediaVolumeUp", "MediaVolumeDown"]
]

[[macro]]
id = 0 # VIM COPY
action = [
    { action = "tap", key = "LShift(Quote)" }, # "
    { action = "tap", key = "LShift(Kc3)" },   # *
    { action = "tap", key = "Y" }
]

[[macro]]
id = 1 # VIM PASTE
action = [
    { action = "tap", key = "Escape" },
    { action = "tap", key = "LShift(Quote)" },
    { action = "tap", key = "LShift(Kc8)" },
    { action = "tap", key = "P" }
]
